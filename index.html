<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Bíblia Sagrada — Estudo, Versículos e Explicações</title>
    <meta name="description" content="Bíblia Sagrada Completa em Português com Explicação de Versículos, Salmos, Busca e Estudos Bíblicos para Celular, iPhone e Computador." />
    
    <!-- PWA & Mobile Web App Meta -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0c0f17" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Apple iOS Safari Specific Meta -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Bíblia Sagrada" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />

    <!-- Google Fonts: Cinzel Decorative, Literata (Bible text), Plus Jakarta Sans (Modern UI) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700;800&family=Literata:ital,opsz,wght@0,7..72,300;0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Register Service Worker for PWA
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('Service Worker registrado:', reg.scope))
            .catch(err => console.log('Falha ao registrar Service Worker:', err));
        });
      }
    </script>
  </body>
</html>
